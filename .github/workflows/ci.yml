name: Verify ConvertFix
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: go test ./... -count=1
      - run: go vet ./...
      - run: go build -tags desktop,production -ldflags '-H windowsgui' -o build/bin/ConvertFix.exe .
      - run: go build -o build/bin/convertfix-cli.exe ./cmd/cli
      - uses: actions/upload-artifact@v4
        with:
          name: ConvertFix-windows
          path: build/bin/*.exe
